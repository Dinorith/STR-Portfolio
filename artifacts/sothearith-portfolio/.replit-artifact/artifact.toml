kind = "web"
previewPath = "/"
title = "Sothearith — Portfolio"
description = "A bold, editorial portfolio for Sothearith, a Cambodia-based UI/UX and product designer. Explore selected product-design projects, detailed case studies, working process, and contact information."
version = "1.0.0"
id = "artifacts/sothearith-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21069

[services.development]
run = "pnpm --filter @workspace/sothearith-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sothearith-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/sothearith-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21069"
BASE_PATH = "/"
